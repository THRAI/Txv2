[package]
name = "tx-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = []

[dependencies]
tx-hal = { path = "../tx-hal" }
tx-platform-adapter = { path = "../tx-platform-adapter" }
tx-substrate = { path = "../tx-substrate" }
tx-subsystems = { path = "../tx-subsystems" }
virtio-drivers = { version = "0.11.0", default-features = false }
# SD/MMC (DesignWare MSHC) driver register definitions, ported from
# Chronix (GPLv3). bitflags pinned to the 1.x line to match the ported
# macro syntax.
bitflags = "1.3"
bitfield-struct = "0.8"

[lib]
path = "src/lib.rs"
doctest = false
