[package]
name = "tx-vdso"
version.workspace = true
edition.workspace = true
license.workspace = true

# no_std, no unsafe usage needed (only re-exports build-artifact bytes).
# This crate is a build-time artefact factory; its lib.rs exports only
# the embedded vDSO .so bytes via include_bytes!.

[lib]
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(vdso_stub)'] }

[build-dependencies]
tx-time = { path = "../tx-time" }

[dev-dependencies]
tx-time = { path = "../tx-time" }
