[package]
name = "tx-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tx-fs = { path = "../tx-fs" }
tx-hal = { path = "../tx-hal" }
tx-reactor = { path = "../tx-reactor" }
# Pre-ELF Phase 2: the production thread future in
# `crates/tx-kernel/src/thread_future.rs` calls
# `tx_shims::linux_syscall::dispatch` to drive the syscall table from
# the reactor task wrapper. Promoted from `[dev-dependencies]` to a
# runtime dependency.
tx-shims = { path = "../tx-shims" }
tx-substrate = { path = "../tx-substrate" }
tx-subsystems = { path = "../tx-subsystems" }

[dev-dependencies]
# `test-support` opens `tx_subsystems::cross_crate_test_support`, which
# the Phase 3b boot-wiring tests use to reset the global `INIT_PROCESS`
# slot (and pid/tid counters) between runs. The same mechanism is
# already used by Phase 2a's syscall-dispatch tests in `tx-shims`.
tx-subsystems = { path = "../tx-subsystems", features = ["test-support"] }

[lib]
path = "src/lib.rs"
test = true
doctest = false
