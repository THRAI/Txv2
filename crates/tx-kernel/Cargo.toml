[package]
name = "tx-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tx-fs = { path = "../tx-fs" }
tx-hal = { path = "../tx-hal" }
tx-reactor = { path = "../tx-reactor" }
tx-substrate = { path = "../tx-substrate" }
tx-subsystems = { path = "../tx-subsystems" }

[dev-dependencies]
# `test-support` opens `tx_subsystems::cross_crate_test_support`, which
# the Phase 3b boot-wiring tests use to reset the global `INIT_PROCESS`
# slot (and pid/tid counters) between runs. The same mechanism is
# already used by Phase 2a's syscall-dispatch tests in `tx-shims`.
tx-subsystems = { path = "../tx-subsystems", features = ["test-support"] }
# Trio Phase 6 end-to-end smoke test consumes
# `tx_shims::linux_syscall::dispatch` to drive the syscall table; tx-shims
# itself is not a runtime dependency of tx-kernel (the dispatch entry
# is consumed only from the smoke test).
tx-shims = { path = "../tx-shims" }

[lib]
path = "src/lib.rs"
test = true
doctest = false
