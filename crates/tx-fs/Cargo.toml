[package]
name = "tx-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"
test = true
doctest = false

[dependencies]
tx-ext4 = { path = "../tx-ext4" }
tx-ext4-format = { path = "../tx-ext4-format" }
tx-fat = { path = "../tx-fat" }
tx-fat-format = { path = "../tx-fat-format" }
tx-hal = { path = "../tx-hal" }
tx-platform-adapter = { path = "../tx-platform-adapter" }
tx-subsystems = { path = "../tx-subsystems" }
tx-substrate = { path = "../tx-substrate" }
tx-test-support = { path = "../tx-test-support" }

[dev-dependencies]
tx-subsystems = { path = "../tx-subsystems", features = ["test-support"] }
