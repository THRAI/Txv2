services:
  # Main development / CI / qemu container.
  # Rust toolchain is installed in the image; cargo registry/git caches are
  # named volumes so an empty host environment still works.
  oscomp:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    working_dir: /workspace
    environment:
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /usr/local/cargo
      RUSTUP_TOOLCHAIN: nightly-2025-05-20

  # Dedicated LA64 busybox builder.
  busybox-la64:
    build:
      context: .
      dockerfile: tools/images/Dockerfile.busybox-la64
    # Override when needed:
    #   TX_DOCKER_UID=$(id -u) TX_DOCKER_GID=$(id -g) docker compose run --rm busybox-la64
    user: "${TX_DOCKER_UID:-1000}:${TX_DOCKER_GID:-1000}"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: tools/images/build-busybox-loongarch64.sh

volumes:
  cargo-registry:
  cargo-git:
