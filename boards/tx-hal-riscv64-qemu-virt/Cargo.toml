[package]
name = "tx-hal-riscv64-qemu-virt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable the `txdbg:trap` / `txdbg:ent` log records emitted by the
# board's debug-trace instrumentation. See
# `boards/tx-hal-riscv64-qemu-virt/src/debug_trace.rs` for the wire
# format and `cargo xtask trap-trace --help` for the parser.
#
# Off by default — production runs do not emit per-trap log lines.
trap-trace = []

[dependencies]
fdt = "0.2.0-alpha2"
tx-hal = { path = "../../crates/tx-hal" }

[lib]
path = "src/lib.rs"
doctest = false
