[package]
name = "tx-trace-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tx-trace-daemon"
path = "src/main.rs"

[dependencies]
tx-observe-types = { path = "../../crates/tx-observe-types", features = ["host"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
prost = "0.13"
siphasher = "1"
memmap2 = "0.9"
object = "0.39"
rustc-demangle = "0.1"

[dev-dependencies]
tempfile = "3"

[workspace]
# Empty table makes this an independent workspace root, preventing host-only
# deps (clap, serde_json, thiserror) from leaking into the no_std kernel build.
