source = "crates/tx-observe-types/src/payload.rs"
variants = [
  { name = "SourceWake", value = 1 },
  { name = "AgentReply", value = 2 },
  { name = "TimerExpire", value = 3 },
  { name = "AbortDelivery", value = 4 },
]

[[controls.groups]]
id = "lock_metrics"
title = "Lock metrics"
default = false
requires_cfg = ["tx_lock_metrics"]
local_cfgs = [
  "tx_lock_metrics_vm",
  "tx_lock_metrics_process",
  "tx_lock_metrics_kernel",
  "tx_lock_metrics_fs",
]
events = ["lock_metric"]

[[controls.groups]]
id = "ds_metrics"
title = "Data-structure method metrics"
default = false
requires_cfg = ["tx_ds_metrics"]
local_cfgs = [
  "tx_ds_metrics_page_allocator",
  "tx_ds_metrics_zone",
  "tx_ds_metrics_process",
]
events = ["ds_method_metric"]

[[controls.groups]]
id = "vm_metrics"
title = "VM path metrics"
default = false
requires_cfg = [
  "tx_vm_recipe_bplus_arc_metrics",
  "tx_vm_recipe_bplus_shape_metrics",
  "tx_vm_recipe_node_alloc_metrics",
  "tx_vm_recipe_publish_shape_metrics",
  "tx_vm_recipe_reclaim_shape_metrics",
  "tx_vm_recipe_phase_metrics",
  "tx_vm_user_access_metrics",
  "tx_vm_phase_metrics",
  "tx_vm_map_path_metrics",
  "tx_vm_pmap_metrics",
  "tx_vm_private_page_metrics",
]
events = ["debug.vm.*", "debug.pagebacked.*"]

[[controls.groups]]
id = "process_clone_metrics"
title = "Process and clone path metrics"
default = false
requires_cfg = [
  "tx_clone_path_metrics",
  "tx_thread_roundtrip_metrics",
  "tx_thread_lifecycle_metrics",
]
events = ["debug.clone_path.*", "debug.thread.*"]

[[controls.groups]]
id = "scheduler_reactor_metrics"
title = "Scheduler and reactor metrics"
default = false
requires_cfg = ["tx_sched_metrics", "tx_reactor_poll_metrics"]
events = ["sched_switch", "debug.sched.*", "debug.reactor.*"]

[[controls.groups]]
id = "signal_futex_metrics"
title = "Signal and futex debug metrics"
default = false
requires_cfg = [
  "tx_sigprocmask_phase_metrics",
  "tx_sigprocmask_detail_metrics",
  "tx_signal_select_metrics",
  "tx_futex_debug_metrics",
]
events = ["debug.signal.*", "debug.futex.*"]

[[controls.groups]]
id = "capability_and_pmap_debug"
title = "Capability and pmap debug metrics"
default = false
requires_cfg = ["tx_cap_upgrade_metrics", "tx_pmap_debug"]
events = ["debug.cap.*", "debug.vm.pmap.*"]

[[controls.groups]]
id = "demo_boot"
title = "Demo boot probes"
default = false
requires_cfg = ["tx_demo_boot"]
events = ["debug.observe.*"]

