[[names.families]]
id = "allocation"
pattern = "debug.alloc.*"
source = "xtask/src/observe.rs KERNEL_FNV1A_STABLE_NAMES; tools/tx-trace-daemon/src/perfetto/writer.rs allocation_track_name"
projection = ["perfetto", "allocation_rows", "text_report"]

[[names.families]]
id = "vm"
pattern = "debug.vm.*"
source = "tools/tx-observe-analyze.py DEBUG_COUNTER_NAMES; xtask/src/observe.rs KERNEL_FNV1A_STABLE_NAMES"
projection = ["counters", "text_report"]

[[names.families]]
id = "pagebacked"
