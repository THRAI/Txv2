[[payloads]]
id = "agent_state_change"
rust_tag = "TxPayloadTag::AgentStateChange"
tag = 23
struct = "reserved"
size_bytes = 16
family = "yield"
status = "reserved"
fields = []

[[payloads]]
id = "track_descriptor"
rust_tag = "TxPayloadTag::TrackDescriptor"
tag = 30
struct = "PayloadTrackDescriptor"
size_bytes = 16
family = "metadata"
fields = [
