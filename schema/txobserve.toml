]

[[event_families]]
id = "syscall"
levels = ["boundary"]
payloads = ["syscall_enter", "syscall_exit", "arg_value"]
control_group = "always_on_when_observe_enabled"
projection = ["spans", "records", "ndjson", "perfetto", "text_report"]

[[event_families]]
id = "drive"
levels = ["drive", "step"]
payloads = ["drive_begin", "drive_end", "step_outcome"]
control_group = "always_on_when_observe_enabled"
projection = ["spans", "records", "ndjson", "perfetto", "text_report"]

[[event_families]]
id = "yield"
levels = ["yield"]
payloads = ["yield_begin", "resume", "wait_source_notify"]
control_group = "always_on_when_observe_enabled"
projection = ["spans", "records", "ndjson", "perfetto", "text_report"]

[[event_families]]
id = "scheduler"
levels = ["sched"]
payloads = ["sched_switch", "process_label", "process_group", "process_fork"]
control_group = "scheduler_reactor_metrics"
projection = ["sched_intervals", "records", "ndjson", "perfetto", "text_report"]

[[event_families]]
id = "allocation"
levels = ["mutation", "phase"]
payloads = ["arg_value", "counter_value"]
control_group = "always_on_when_callsite_enabled"
projection = ["allocation_rows", "records", "perfetto", "text_report"]

[[event_families]]
id = "lock"
levels = ["boundary"]
payloads = ["counter_value"]
control_group = "lock_metrics"
projection = ["lock_rows", "records", "perfetto", "text_report"]

[[event_families]]
id = "ds_method"
levels = ["boundary"]
payloads = ["counter_value"]
control_group = "ds_metrics"
projection = ["ds_method_rows", "records", "perfetto", "text_report"]

[[event_families]]
id = "phase"
levels = ["phase"]
payloads = ["phase_transition"]
control_group = "always_on_when_observe_enabled"
projection = ["spans", "records", "ndjson", "perfetto"]

[[event_families]]
id = "mutation"
levels = ["mutation"]
payloads = ["mutation_zone_sign", "mutation_index_commit"]
control_group = "always_on_when_callsite_enabled"
projection = ["records", "ndjson", "perfetto"]

[[event_families]]
id = "panic"
levels = ["boundary"]
payloads = ["panic"]
control_group = "always_on_when_observe_enabled"
projection = ["records", "repairs", "ndjson", "perfetto", "text_report"]

[[migration.checks]]
id = "payload-tags-match-rust"
description = "Compare [[payloads]].tag and rust_tag against TxPayloadTag."
status = "enforced"

[[migration.checks]]
id = "payload-structs-match-rust"
description = "Compare [[payloads]].struct, size_bytes, and fields against payload.rs structs and lib.rs size assertions."
status = "enforced"

[[migration.checks]]
id = "levels-match-rust"
description = "Compare [[abi.levels]] against TxTraceLevel."
status = "enforced"

[[migration.checks]]
id = "record-kinds-match-rust"
description = "Compare [[abi.record_kinds]] against TxTraceKind."
status = "enforced"

[[migration.checks]]
id = "cfgs-match-workspace"
description = "Compare [[controls.cfgs]] against Cargo.toml unexpected_cfgs."
status = "enforced"

[[migration.checks]]
id = "projection-schema-match-analyzer"
description = "Compare [[host.projections]] table schemas against tools/tx-observe-analyze.py."
status = "enforced"

[[migration.checks]]
id = "event-family-refs-resolve"
description = "Verify event family level, payload, control-group, and projection references resolve inside this schema."
status = "enforced"

[[migration.checks]]
id = "explicit-tracks-match-rust-host"
description = "Compare [[tracks.explicit]] against ALLOC_TRACK_* constants and Perfetto explicit track names."
status = "enforced"

[[migration.checks]]
id = "stable-names-match-xtask-analyzer"
description = "Compare names families and eventual concrete names against xtask/analyzer stable debug-name sources."
status = "planned"
