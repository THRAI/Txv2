id = "ds_method"
pattern = "debug.ds.*"
source = "crates/tx-observe/src/lib.rs ds_method_metric; tools/tx-observe-analyze.py ds_method_rows"
projection = ["ds_method_rows", "text_report", "perfetto"]

[[names.families]]
id = "ds_method_track"
pattern = "debug.ds.method"
source = "tools/tx-trace-daemon/src/perfetto/writer.rs explicit_track_descriptor"
projection = ["perfetto"]

[[names.families]]
id = "sched"
pattern = "debug.sched.*"
source = "crates/tx-reactor; tools/tx-observe-analyze.py scheduler reports"
projection = ["sched_intervals", "counters", "perfetto", "text_report"]

[[names.families]]
id = "futex"
pattern = "debug.futex.*"
source = "crates/tx-subsystems/src/futex; tools/tx-observe-analyze.py futex reports"
projection = ["counters", "text_report"]

