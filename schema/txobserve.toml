# tx-observe core schema inventory.
#
# This is the single handwritten L0 schema seed for the L0-L6 refactor.  The
# first version mirrors current truth without changing txtrace-v0, generated
# Rust, daemon decode, or analyzer projections.  Follow-up
# `xtask observe-schema check` work should compare this file against the
# current Rust/Python tables before any codegen becomes authoritative.

[schema]
id = "txobserve"
version = 0
status = "inventory"
date = "2026-07-11"
wire_format = "txtrace-v0"
record_size_bytes = 80
payload_size_bytes = 16
hot_path_parse = false

[sources]
design = "docs/Txv3/08_OBSERVATION_L0_L6_REFACTOR_v0.md"
current_framework = "docs/Txv3/08_OBSERVATION_v1.md"
serialization = "docs/Txv3/08_OBSERVATION_SERIALIZATION_v0.md"
host = "docs/Txv3/08_OBSERVATION_HOST_v0.md"
record_abi = "crates/tx-observe-types/src/record.rs"
payload_abi = "crates/tx-observe-types/src/payload.rs"
producer = "crates/tx-observe/src/lib.rs"
xtask_surface = "xtask/src/observe.rs"
daemon_decode = "tools/tx-trace-daemon/src/decode.rs"
daemon_replay = "tools/tx-trace-daemon/src/replay.rs"
perfetto_writer = "tools/tx-trace-daemon/src/perfetto/writer.rs"
analyzer = "tools/tx-observe-analyze.py"
workspace_cfg = "Cargo.toml"

[[abi.levels]]
id = "boundary"
rust = "TxTraceLevel::Boundary"
value = 0
description = "Syscall and external boundary records."

[[abi.levels]]
id = "script"
rust = "TxTraceLevel::Script"
value = 1
description = "Script-level operation records."

[[abi.levels]]
id = "drive"
rust = "TxTraceLevel::Drive"
value = 2
description = "Drive-loop records."

[[abi.levels]]
id = "yield"
rust = "TxTraceLevel::Yield"
value = 3
description = "Yield, resume, and wake records."

[[abi.levels]]
id = "step"
rust = "TxTraceLevel::Step"
value = 4
description = "Step iteration records."

[[abi.levels]]
id = "phase"
rust = "TxTraceLevel::Phase"
value = 5
description = "Phase transition records."

[[abi.levels]]
id = "mutation"
rust = "TxTraceLevel::Mutation"
value = 6
description = "Mutation diagnostic records."

[[abi.levels]]
id = "sched"
rust = "TxTraceLevel::Sched"
value = 7
description = "Reactor scheduler task-on-hart intervals."

[[abi.record_kinds]]
id = "nop"
rust = "TxTraceKind::Nop"
value = 0
canonical_event = "ignore"

[[abi.record_kinds]]
id = "clock_snapshot"
rust = "TxTraceKind::ClockSnapshot"
value = 1
canonical_event = "record"

[[abi.record_kinds]]
id = "track_descriptor"
rust = "TxTraceKind::TrackDescriptor"
value = 2
canonical_event = "record"

[[abi.record_kinds]]
id = "string_descriptor"
rust = "TxTraceKind::StringDescriptor"
value = 3
canonical_event = "record"

[[abi.record_kinds]]
id = "span_begin"
rust = "TxTraceKind::SpanBegin"
value = 10
canonical_event = "span_begin"

[[abi.record_kinds]]
id = "span_end"
rust = "TxTraceKind::SpanEnd"
value = 11
canonical_event = "span_end"

[[abi.record_kinds]]
id = "instant"
rust = "TxTraceKind::Instant"
value = 12
canonical_event = "instant"

[[abi.record_kinds]]
id = "counter"
rust = "TxTraceKind::Counter"
value = 13
canonical_event = "counter"

[[abi.record_kinds]]
id = "track_tombstone"
rust = "TxTraceKind::TrackTombstone"
value = 14
canonical_event = "record"

[[abi.record_kinds]]
id = "panic_marker"
rust = "TxTraceKind::PanicMarker"
value = 31
canonical_event = "panic"

[[abi.record_kinds]]
id = "arg_continuation"
rust = "TxTraceKind::ArgContinuation"
value = 40
canonical_event = "arg"

[[payloads]]
id = "none"
rust_tag = "TxPayloadTag::None"
tag = 0
struct = "None"
size_bytes = 0
family = "metadata"
fields = []

[[payloads]]
id = "syscall_enter"
rust_tag = "TxPayloadTag::SyscallEnter"
tag = 1
struct = "PayloadSyscallEnter"
size_bytes = 8
family = "syscall"
fields = [
  { name = "sysno", type = "u32" },
  { name = "abi", type = "u16" },
  { name = "argc", type = "u16" },
]

[[payloads]]
id = "syscall_exit"
rust_tag = "TxPayloadTag::SyscallExit"
tag = 2
struct = "PayloadSyscallExit"
size_bytes = 16
family = "syscall"
fields = [
  { name = "ret", type = "i64" },
  { name = "errno", type = "i32" },
  { name = "result_kind", type = "u8", enum = "SyscallResultKind" },
  { name = "_pad", type = "[u8; 3]", reserved = true },
]

[[payloads]]
id = "drive_begin"
rust_tag = "TxPayloadTag::DriveBegin"
tag = 10
struct = "PayloadDriveBegin"
size_bytes = 12
family = "drive"
fields = [
  { name = "op_type", type = "u32" },
  { name = "mode", type = "u8", enum = "DriveMode" },
  { name = "interrupt", type = "u8", enum = "DriveInterrupt" },
  { name = "has_deadline", type = "u8" },
  { name = "_pad", type = "u8", reserved = true },
  { name = "task_id_low", type = "u32" },
]

[[payloads]]
id = "drive_end"
rust_tag = "TxPayloadTag::DriveEnd"
tag = 11
struct = "PayloadDriveEnd"
size_bytes = 16
family = "drive"
fields = [
  { name = "ret", type = "i64" },
  { name = "errno", type = "i32" },
  { name = "result_kind", type = "u8", enum = "DriveResultKind" },
  { name = "_pad", type = "[u8; 3]", reserved = true },
]

[[payloads]]
id = "step_outcome"
rust_tag = "TxPayloadTag::StepOutcome"
tag = 12
struct = "PayloadStepOutcome"
size_bytes = 16
family = "step"
fields = [
  { name = "variant", type = "u8", enum = "StepOutcomeVariant" },
  { name = "progress_empty", type = "u8" },
  { name = "progress_kind", type = "u8", enum = "TxProgressKind" },
  { name = "shape_kind", type = "u8", enum = "YieldShapeKind" },
  { name = "errno", type = "i32" },
  { name = "progress_value", type = "u32" },
  { name = "_pad", type = "u32", reserved = true },
]

[[payloads]]
id = "yield_begin"
rust_tag = "TxPayloadTag::YieldBegin"
tag = 20
struct = "PayloadYieldBegin"
size_bytes = 16
family = "yield"
fields = [
  { name = "shape_kind", type = "u8", enum = "YieldShapeKind" },
  { name = "_pad", type = "[u8; 3]", reserved = true },
  { name = "task_id_low", type = "u32" },
  { name = "wait_generation", type = "u64" },
