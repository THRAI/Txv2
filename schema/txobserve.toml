[[host.inputs]]
id = "txtrace"
extension = ".txtrace"
reader_target = "TraceReader::TxtraceRegion"
current_source = "tools/tx-trace-daemon/src/replay.rs decode_file_bytes; tools/tx-observe-analyze.py load_txtrace_records"

[[host.inputs]]
id = "rawrecords"
extension = ".rawrecords"
reader_target = "TraceReader::RawRecords"
current_source = "tools/tx-trace-daemon/src/replay.rs live finalize; tools/tx-observe-analyze.py load_rawrecords"

[[host.inputs]]
id = "live_guest_mem"
reader_target = "TraceReader::LiveGuestMem"
current_source = "tools/tx-trace-daemon/src/replay.rs live_guest_mem"

[[host.projections]]
id = "ndjson"
kind = "transcoder"
target_type = "NdjsonTranscoder"
current_source = "tools/tx-trace-daemon/src/replay.rs"
coverage_default = "emit"

[[host.projections]]
id = "perfetto"
kind = "transcoder"
target_type = "PerfettoTranscoder"
current_source = "tools/tx-trace-daemon/src/perfetto/writer.rs"
coverage_default = "event_specific"

[[host.projections]]
id = "text_report"
kind = "report"
current_source = "tools/tx-observe-analyze.py analyze_* report functions"
coverage_default = "event_specific"

[[host.projections]]
id = "records"
kind = "sql_view"
current_source = "tools/tx-observe-analyze.py RECORD_SQL_SCHEMA"
columns = [
  { name = "ts", type = "UBIGINT" },
  { name = "hart", type = "UINTEGER" },
  { name = "seq", type = "UBIGINT" },
  { name = "kind", type = "VARCHAR" },
  { name = "level", type = "VARCHAR" },
  { name = "span", type = "VARCHAR" },
  { name = "parent", type = "VARCHAR" },
  { name = "name_id", type = "UINTEGER" },
  { name = "payload_tag", type = "UINTEGER" },
]

[[host.projections]]
id = "repairs"
kind = "sql_view"
current_source = "tools/tx-observe-analyze.py REPAIR_SQL_SCHEMA"
columns = [
  { name = "hart", type = "UINTEGER" },
  { name = "seq_around", type = "UBIGINT" },
  { name = "category", type = "VARCHAR" },
  { name = "details", type = "VARCHAR" },
]

[[host.projections]]
id = "spans"
kind = "derived_table"
file = "spans.parquet"
current_source = "tools/tx-observe-analyze.py PARQUET_SCHEMAS"
columns = [
  { name = "span", type = "VARCHAR" },
  { name = "name_id", type = "UINTEGER" },
  { name = "sysno", type = "UBIGINT" },
  { name = "begin", type = "UBIGINT" },
  { name = "end", type = "UBIGINT" },
  { name = "dur", type = "UBIGINT" },
  { name = "begin_hart", type = "UINTEGER" },
  { name = "end_hart", type = "UINTEGER" },
  { name = "task_id", type = "UBIGINT" },
  { name = "process_id", type = "UBIGINT" },
  { name = "ret", type = "BIGINT" },
  { name = "errno", type = "BIGINT" },
  { name = "dangling", type = "BOOLEAN" },
  { name = "sched_harts", type = "UINTEGER[]" },
  { name = "sched_segments", type = "UBIGINT" },
  { name = "sched_coverage", type = "UBIGINT" },
  { name = "sched_migrated", type = "BOOLEAN" },
]

[[host.projections]]
id = "counters"
kind = "derived_table"
file = "counters.parquet"
