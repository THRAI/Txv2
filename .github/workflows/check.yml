name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Rust targets
        run: rustup target add riscv64gc-unknown-none-elf loongarch64-unknown-none

      - name: Run txKernel CI
        run: cargo xtask ci

  qemu-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc

      - name: Install RV64 Rust target
        run: rustup target add riscv64gc-unknown-none-elf

      - name: Run slow QEMU CI
        run: cargo xtask ci-slow
